name: P01-COL1 Genuine Stella Debugger Scanline Readout

on:
  pull_request:
    paths:
      - 'experiments/p01_col1_single_arena.asm'
      - '.github/workflows/p01-col1-debugger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stella-scanline-debugger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb scrot xdotool x11-utils
          mkdir -p build/col1-debug
      - name: Assemble frozen 4 KiB COL1 source and configure debugger
        shell: bash
        run: |
          set -euo pipefail
          dasm experiments/p01_col1_single_arena.asm -f3 -obuild/col1-debug/p01-col1.bin -lbuild/col1-debug/p01-col1.lst -sbuild/col1-debug/p01-col1.sym
          test "$(stat -c %s build/col1-debug/p01-col1.bin)" -eq 4096
          sha256sum build/col1-debug/p01-col1.bin > build/col1-debug/ROM_SHA256.txt
          mkdir -p "$HOME/.config/stella"
          cat > "$HOME/.config/stella/autoexec.script" <<'SCRIPT'
          base dec
          frame #10
          print _scanEnd
          print _fCount
          print _fCycles
          print _fWsyncCycles
          print _scanEnd
          saveSes
          SCRIPT
          cp "$HOME/.config/stella/autoexec.script" build/col1-debug/AUTOEXEC.script
      - name: Run authentic Stella 6.7.1 debugger and inspect output
        shell: bash
        run: |
          set -euo pipefail
          export SDL_AUDIODRIVER=dummy
          export SDL_VIDEODRIVER=x11
          export SDL_RENDER_DRIVER=software
          xvfb-run -a -s "-screen 0 1400x1000x24" bash -c '
            set -eu
            stella -debug -logtoconsole 1 -audio.enabled 0 -threads 0 -vsync 0 -video software -fullscreen 0 "$PWD/build/col1-debug/p01-col1.bin" > build/col1-debug/STELLA_DEBUGGER.log 2>&1 &
            pid=$!
            win=""
            for i in $(seq 1 30); do
              xdotool search --onlyvisible --name Stella > build/col1-debug/WINDOWS.txt 2>/dev/null || true
              win=$(head -n1 build/col1-debug/WINDOWS.txt || true)
              if [ -n "$win" ]; then break; fi
              if ! kill -0 "$pid" 2>/dev/null; then break; fi
              sleep 1
            done
            xwininfo -root -tree > build/col1-debug/XWINDOWS.txt || true
            ps -p "$pid" -o pid,stat,etime,args > build/col1-debug/PROCESS.txt || true
            if [ -n "$win" ]; then
              xdotool windowfocus "$win" || true
              for cmd in "base dec" "print _scanEnd" "print _fCount" "print _fCycles" "print _fWsyncCycles" "saveSes"; do
                xdotool type --window "$win" --clearmodifiers --delay 30 "$cmd" || true
                xdotool key --window "$win" Return || true
                sleep 0.6
              done
            fi
            scrot -z build/col1-debug/DEBUGGER_DESKTOP.png || true
            sleep 2
            kill "$pid" || true
            wait "$pid" || true
          '
          find "$HOME/.config/stella" "$PWD" -maxdepth 4 -type f -name '*.txt' -printf '%p %s bytes\n' > build/col1-debug/STELLA_FILES.txt
          find "$HOME/.config/stella" -type f -name '*.txt' -print -exec cp '{}' build/col1-debug/ \; || true
          find "$HOME" -maxdepth 1 -type f -name 'session_*.txt' -print -exec cp '{}' build/col1-debug/ \; || true
          grep -Hni '_scanEnd' build/col1-debug/session_*.txt > build/col1-debug/STELLA_SCANLINE_READOUT.txt || true
          test -s build/col1-debug/DEBUGGER_DESKTOP.png
          echo "=== debugger console extract ==="
          grep -Ei '_scanEnd|_fCount|262|scanline|session|frame|error' build/col1-debug/STELLA_DEBUGGER.log | tail -60 || true
          find build/col1-debug -maxdepth 1 -name '*.txt' -type f -exec grep -iH '_scanEnd' '{}' \; || true
      - name: Preserve original debugger logs, screenshots and ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-col1-authentic-stella-debugger-evidence
          path: build/col1-debug/
          if-no-files-found: warn
