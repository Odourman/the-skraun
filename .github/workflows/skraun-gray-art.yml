name: P01 Gray Skraun Overhead Art (experimental)

on:
  push:
    branches: [experiment/gray-topdown-skraun]
    paths:
      - 'experiments/p01_skraun_gray_topdown.asm'
      - '.github/workflows/skraun-gray-art.yml'
      - 'tests/check_gray_skraun.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gray-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install assembler and emulator tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool scrot python3-pil
      - name: Assemble isolated gray overhead ROM
        shell: bash
        run: |
          mkdir -p build
          dasm experiments/p01_skraun_gray_topdown.asm -f3 -obuild/skraun-gray-overhead.bin -lbuild/skraun-gray-overhead.lst -sbuild/skraun-gray-overhead.sym
          test "$(stat -c %s build/skraun-gray-overhead.bin)" -eq 4096
          sha256sum build/skraun-gray-overhead.bin | tee build/SHA256SUMS
          stella -rominfo build/skraun-gray-overhead.bin | tee build/rominfo.txt
      - name: Capture real Stella sprite sizes and joystick movement
        shell: bash
        run: |
          set -euo pipefail
          export SDL_AUDIODRIVER=dummy
          export SDL_VIDEODRIVER=x11
          export SDL_RENDER_DRIVER=software
          xvfb-run -a -s "-screen 0 1024x768x24" bash -c '
            set -euo pipefail
            stella -logtoconsole 1 -audio.enabled 0 -threads 0 -vsync 0 -video software -fullscreen 0 -snapsavedir "$PWD/build" -sssingle 1 -ss1x 1 "$PWD/build/skraun-gray-overhead.bin" > build/stella.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            wid=""
            for i in $(seq 1 15); do
              wid=$(xdotool search --onlyvisible --name Stella 2>/dev/null | head -1 || true)
              [ -n "$wid" ] && break
              sleep 1
            done
            test -n "$wid"
            xdotool windowfocus "$wid" || true
            sleep 1
            capture(){
              xdotool key --window "$wid" F12
              sleep 0.8
              cp build/skraun-gray-overhead.png "build/$1.png"
            }
            select_next(){
              xdotool keydown --window "$wid" F1
              sleep 0.3
              xdotool keyup --window "$wid" F1
              sleep 0.7
            }
            capture gray_level1
            select_next
            capture gray_level2
            select_next
            capture gray_level3
            xdotool keydown --window "$wid" Right
            sleep 0.40
            capture gray_right_walk
            xdotool keyup --window "$wid" Right
            xdotool keydown --window "$wid" Left
            sleep 0.55
            capture gray_left_walk
            xdotool keyup --window "$wid" Left
            scrot -z build/stella_desktop.png
          '
          /usr/bin/python3 tests/check_gray_skraun.py | tee build/gray_sprite_metrics.txt
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gray-topdown-skraun-test
          path: build/
          if-no-files-found: warn
