name: ROMDEV B Stella Debugger frame timing capture
on:
  push:
    branches: [experiment/romdev-b-gray-stella]
    paths:
      - '.github/workflows/romdev-b-debugger.yml'
      - 'experiments/romdev_b_refp0.asm'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debugger:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool scrot python3-pil
      - name: Build A ROM and prepare debugger
        shell: bash
        run: |
          mkdir -p build "$HOME/.config/stella"
          dasm experiments/romdev_b_refp0.asm -f3 -obuild/romdev-b.bin -lbuild/romdev-b.lst -sbuild/romdev-b.sym
          sha256sum build/romdev-b.bin | tee build/SHA256.txt
          cat > "$HOME/.config/stella/autoexec.script" <<'SCRIPT'
          base dec
          frame #30
          print _scanEnd
          print _fCount
          print _fCycles
          SCRIPT
      - name: Inspect genuine debugger screen after 30 frames
        shell: bash
        run: |
          set -euo pipefail
          export SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=x11 SDL_RENDER_DRIVER=software
          xvfb-run -a -s "-screen 0 1280x900x24" bash -c '
            stella -debug -logtoconsole 1 -audio.enabled 0 -threads 0 -vsync 0 -video software -fullscreen 0 "$PWD/build/romdev-b.bin" > build/debugger.log 2>&1 &
            pid=$!
            wid=""
            for i in $(seq 1 30); do
              wid=$(xdotool search --onlyvisible --name Stella 2>/dev/null | head -1 || true)
              [ -n "$wid" ] && break
              sleep 1
            done
            test -n "$wid" || exit 9
            sleep 3
            if [ -n "$wid" ]; then
              xdotool windowfocus "$wid" || true
              for cmd in "base dec" "frame #30" "print _scanEnd" "print _fCount" "print _fCycles"; do
                xdotool type --window "$wid" --clearmodifiers --delay 12 "$cmd" || true
                xdotool key --window "$wid" Return || true
                sleep 0.5
              done
            fi
            scrot -z build/debugger_desktop.png
            kill "$pid" 2>/dev/null || true
          '
          test -s build/debugger_desktop.png
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          im=Image.open('build/debugger_desktop.png').convert('RGB')
          count=sum(max(px)>30 for px in im.getdata())
          print("Visible debugger pixels:",count)
          assert count>12000, "blank debugger screenshot"
          PY
      - name: Archive actual debugger diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: romdev-b-stella-debugger-evidence
          path: build/
          if-no-files-found: warn
