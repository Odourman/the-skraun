name: FULLGAME-1 sparse PF1 and early GRP1 DASM/Stella experiment
on:
  push:
    branches: [experiment/fullgame1-kernel-sparsepf-earlygrp-20261125]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native DASM and Stella with debugger
        run: |
          sudo sed -i 's|http://us-east-2.ec2.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          timeout 180 sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=18
          timeout 600 sudo apt-get install -y --no-install-recommends dasm stella xvfb xdotool scrot
      - name: Compile four native F6 banks and verify preserved GAMEPLAY-5
        run: |
          python3 scripts/fullgame1_build.py
          cd build/fullgame1
          sha256sum -c SHA256SUMS.txt
          test "$(stat -c %s THE_SKRAUN_FULLGAME1_F6_NTSC.bin)" = "16384"
          echo "SHA from tested local build (must match or fail):"
          echo "e5d027c35ae8bdbc0bac60a2ba41abbd5b2a777f7e32726cc9266499c02cb258  THE_SKRAUN_FULLGAME1_F6_NTSC.bin" | sha256sum -c -
      - name: Genuine Stella baseline
        run: bash scripts/fullgame1_stella.sh
      - name: 17 real joystick/FIRE Stella scenes
        run: |
          bash scripts/fullgame1_stella_regression.sh
          python3 scripts/fullgame1_report_scenes.py
      - name: Preserve proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SKRAUN-SPARSE-PF-EARLY-GRP-F6-EVIDENCE
          path: build/fullgame1/
          if-no-files-found: warn
