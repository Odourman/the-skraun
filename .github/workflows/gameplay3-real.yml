name: GAMEPLAY-3 authentic DASM Stella K1T-R1 native masks and bounded renderer
on:
  push:
    branches: [experiment/gameplay3-physical-enemies-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  physical-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Install real DASM 6502 and Stella 6.7.1, physical debugger tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool scrot python3-pil python3-numpy
      - name: Verify exact untouched GAMEPLAY-2 playable checkpoint
        run: |
          set -euo pipefail
          mkdir -p build/gameplay3/base
          dasm experiments/gameplay2_bank0.asm -f3 -obuild/gameplay3/base/bank0.bin -lbuild/gameplay3/base/bank0.lst -sbuild/gameplay3/base/bank0.sym 2>&1 | tee build/gameplay3/base/DASM0.log
          dasm experiments/gameplay2_bank1.asm -f3 -obuild/gameplay3/base/bank1.bin -lbuild/gameplay3/base/bank1.lst -sbuild/gameplay3/base/bank1.sym 2>&1 | tee build/gameplay3/base/DASM1.log
          cat build/gameplay3/base/bank0.bin build/gameplay3/base/bank1.bin > build/gameplay3/base/gameplay2_checkpoint.bin
          test "$(stat -c %s build/gameplay3/base/gameplay2_checkpoint.bin)" -eq 8192
          echo '1ebfba72cea63a36b3a7434233758242112680b2ad6f2b282c9bbea5652fa2fd  build/gameplay3/base/gameplay2_checkpoint.bin' | sha256sum -c -
      - name: Build actual GAMEPLAY-3 F8 playable prototype and exact 12 physical diagnostic ROMs
        run: |
          set -euo pipefail
          dasm experiments/gameplay3_bank0.asm -f3 -obuild/gameplay3/bank0.bin -lbuild/gameplay3/bank0.lst -sbuild/gameplay3/bank0.sym 2>&1 | tee build/gameplay3/DASM0.log
          dasm experiments/gameplay3_bank1.asm -f3 -obuild/gameplay3/bank1.bin -lbuild/gameplay3/bank1.lst -sbuild/gameplay3/bank1.sym 2>&1 | tee build/gameplay3/DASM1.log
          test "$(stat -c %s build/gameplay3/bank0.bin)" -eq 4096
          test "$(stat -c %s build/gameplay3/bank1.bin)" -eq 4096
          cat build/gameplay3/bank0.bin build/gameplay3/bank1.bin > build/gameplay3/gameplay3_f8.bin
          test "$(stat -c %s build/gameplay3/gameplay3_f8.bin)" -eq 8192
          python3 scripts/gameplay3_generate_art_roms.py
          for src in build/gameplay3/variants/*.asm; do
            p="${src%.asm}"
            dasm "$src" -f3 -o"$p".bank1.bin -l"$p".lst -s"$p".sym > "$p".DASM.log 2>&1
            cat build/gameplay3/bank0.bin "$p".bank1.bin > "$p".bin
            test "$(stat -c %s "$p".bin)" -eq 8192
          done
          sha256sum experiments/gameplay3_bank0.asm experiments/gameplay3_bank1.asm build/gameplay3/gameplay3_f8.bin > build/gameplay3/SHA256SUMS
          sha256sum build/gameplay3/variants/*.bin > build/gameplay3/VARIANT_SHA256SUMS
      - name: Real Stella native source-pixel proof for six poses x both mirror directions
        run: |
          set -euo pipefail
          bash scripts/gameplay3_stella_art.sh
          /usr/bin/python3 tests/gameplay3_real_art_pixels.py | tee build/gameplay3/ART_PIXEL_AUDIT.log
      - name: Bounded authentic previous GAMEPLAY-2 joystick/orb/L3/stage regression
        run: |
          set -euo pipefail
          bash scripts/gameplay3_stella_regression.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          r=Path('build/gameplay3/scenes')
          for name in ['start','orb_L2','fight_stage1','stage2_L3','sword_warning','sword_hit','gameover_restart']:
            p=r/name/'SESSION_TYPED.txt'
            assert p.exists() and '#262' in p.read_text(), ('no real 262 line Stella session',name)
            assert (r/name/'DEBUGGER_DESKTOP.png').exists(),name
            print('AUTHENTIC_GAMEPLAY_REPLAY_262',name)
          PY
      - name: Preserve full developer ROM, source, timings, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GAMEPLAY3-REAL-DASM-STELLA-ENEMY-ART
          path: |
            build/gameplay3/
            experiments/gameplay3_bank0.asm
            experiments/gameplay3_bank1.asm
            experiments/gameplay3/P1_K1T_R1_FROZEN_SOURCE.json
            scripts/gameplay3_generate_art_roms.py
            scripts/gameplay3_stella_art.sh
            scripts/gameplay3_stella_regression.sh
            tests/gameplay3_real_art_pixels.py
          if-no-files-found: warn
