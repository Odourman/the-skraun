name: P02-B3b direct live-joystick Stella Debugger 262-line states
on:
  push:
    branches: [experiment/romdev-b3b-horizontal-follow]
    paths:
      - '.github/workflows/romdev-b3b-joystick-debugger.yml'
      - 'experiments/romdev_b3b_dynamic.asm'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-joystick-debugger:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool scrot python3-pil
      - name: Build exact ROM
        shell: bash
        run: |
          mkdir -p build
          dasm experiments/romdev_b3b_dynamic.asm -f3 -obuild/romdev-b3b.bin -lbuild/romdev-b3b.lst -sbuild/romdev-b3b.sym
          sha256sum build/romdev-b3b.bin | tee build/SHA256SUMS
      - name: Create and inspect real joystick states in running Stella and switch to debugger
        shell: bash
        run: |
          set -euo pipefail
          export SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=x11 SDL_RENDER_DRIVER=software
          xvfb-run -a -s "-screen 0 1280x900x24" bash -c '
            set -euo pipefail
            for state in initial right left reverse; do
              stella -logtoconsole 1 -audio.enabled 0 -threads 0 -vsync 0 -video software -fullscreen 0 -snapsavedir "$PWD/build" -sssingle 1 -ss1x 1 "$PWD/build/romdev-b3b.bin" > "build/normal_$state.log" 2>&1 &
              pid=$!
              wid=""
              for trial in $(seq 1 25); do
                wid=$(xdotool search --onlyvisible --name Stella 2>/dev/null | head -1 || true)
                test -n "$wid" && break
                sleep 1
              done
              test -n "$wid" || exit 9
              xdotool windowfocus "$wid" || true
              sleep 1.2
              case "$state" in
                right) xdotool keydown --window "$wid" Right; sleep 2; xdotool keyup --window "$wid" Right ;;
                left) xdotool keydown --window "$wid" Left; sleep 2; xdotool keyup --window "$wid" Left ;;
                reverse)
                  xdotool keydown --window "$wid" Right; sleep 1.8; xdotool keyup --window "$wid" Right
                  xdotool keydown --window "$wid" Left; sleep 0.8; xdotool keyup --window "$wid" Left ;;
              esac
              sleep 0.3
              xdotool key --window "$wid" F12
              sleep 0.5
              cp build/romdev-b3b.png "build/live_$state.png"
              xdotool key --window "$wid" grave
              sleep 1.3
              dwid=$(xdotool search --onlyvisible --name Stella | tail -1 || true)
              test -n "$dwid"
              xdotool windowfocus "$dwid" || true
              for cmd in "base dec" "frame #12" "print _scanEnd"; do
                xdotool type --window "$dwid" --clearmodifiers --delay 12 "$cmd"
                xdotool key --window "$dwid" Return
                sleep 0.35
              done
              scrot -z "build/debugger_live_$state.png"
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              sleep 0.6
            done
          '
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ('initial','right','left','reverse'):
              debug=Image.open('build/debugger_live_'+name+'.png').convert('RGB')
              nonblack=sum(max(p)>30 for p in debug.getdata())
              print(name,'debugger visible pixels',nonblack)
              assert nonblack>80000, 'no debugger UI for '+name
              normal=Image.open('build/live_'+name+'.png').convert('RGB')
              n=sum(max(p)>40 for p in normal.getdata())
              assert n>500,'no live game snapshot for '+name
          PY
      - name: Preserve raw screenshot timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: romdev-b3b-actual-joystick-stella-debugger
          path: build/
          if-no-files-found: warn
