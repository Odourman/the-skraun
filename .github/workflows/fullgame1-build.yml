name: FULLGAME-1 F6 real DASM + Stella baseline
on:
  push:
    branches: [experiment/fullgame1-complete-skraun-20261123]
    paths:
      - scripts/fullgame1_build.py
      - scripts/fullgame1_stella.sh
      - scripts/fullgame1_arrow_patch.py
      - scripts/fullgame1_sound_bank1.asm
      - scripts/fullgame1_sound_patch.py
      - scripts/fullgame1_actor_bank0.asm
      - scripts/fullgame1_actor_patch.py
      - scripts/fullgame1_geometry_patch.py
      - scripts/fullgame1_world_patch.py
      - scripts/fullgame1_stella_regression.sh
      - scripts/fullgame1_report_scenes.py
      - .github/workflows/fullgame1-build.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install real assembler and emulator
        run: |
          sudo sed -i 's|http://us-east-2.ec2.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          timeout 180 sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=18
          timeout 600 sudo apt-get install -y --no-install-recommends dasm stella xvfb xdotool scrot
      - name: Assemble F6 and compare two original banks byte-for-byte
        run: |
          python3 scripts/fullgame1_build.py
          cd build/fullgame1
          sha256sum -c SHA256SUMS.txt
          test "$(stat -c %s THE_SKRAUN_FULLGAME1_F6_NTSC.bin)" = "16384"
      - name: Preserve real DASM/Stella toolchain for reproducibility
        run: |
          mkdir -p build/fullgame1/tools
          cp "$(command -v dasm)" build/fullgame1/tools/dasm
          cp "$(command -v stella)" build/fullgame1/tools/stella
          ldd "$(command -v dasm)" > build/fullgame1/tools/dasm_ldd.txt || true
          ldd "$(command -v stella)" > build/fullgame1/tools/stella_ldd.txt || true
      - name: Emulator bootstrap test; never claim full game from it
        run: bash scripts/fullgame1_stella.sh
      - name: Real ranged combat / arrow / L3 frames in Stella
        run: |
          bash scripts/fullgame1_stella_regression.sh
          python3 scripts/fullgame1_report_scenes.py
      - name: Publish actual source/build/emulator artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FULLGAME1-F6-BOOTSTRAP-REAL-DASM-STELLA
          path: |
            build/fullgame1/
          if-no-files-found: warn
