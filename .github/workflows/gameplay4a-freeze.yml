name: GAMEPLAY-4 freeze last physically playable A checkpoint from actual DASM
on:
  push:
    branches: [experiment/gameplay4-dynamic-combat-arrow-20261122]
    paths: [docs/gameplay4/FREEZE_REQUEST.txt]
permissions:
  contents: write
jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/gameplay4-dynamic-combat-arrow-20261122
          persist-credentials: true
      - name: Install genuine DASM 6502 assembler
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm
      - name: Generate safe dynamic K1T/R1 without visually rejected M1 arrow
        run: |
          set -euo pipefail
          python3 scripts/gameplay4_make_checkpoint_a.py
          cp build/gameplay4/checkpoint_A/bank0.asm experiments/gameplay4a_bank0.asm
          cp build/gameplay4/checkpoint_A/bank1.asm experiments/gameplay4a_bank1.asm
          dasm experiments/gameplay4a_bank0.asm -f3 -oexperiments/gameplay4a_bank0.bin -lexperiments/gameplay4a_bank0.lst -sexperiments/gameplay4a_bank0.sym 2>&1 | tee experiments/gameplay4a_DASM0.log
          dasm experiments/gameplay4a_bank1.asm -f3 -oexperiments/gameplay4a_bank1.bin -lexperiments/gameplay4a_bank1.lst -sexperiments/gameplay4a_bank1.sym 2>&1 | tee experiments/gameplay4a_DASM1.log
          test "$(stat -c %s experiments/gameplay4a_bank0.bin)" -eq 4096
          test "$(stat -c %s experiments/gameplay4a_bank1.bin)" -eq 4096
          cat experiments/gameplay4a_bank0.bin experiments/gameplay4a_bank1.bin > experiments/gameplay4a_f8_ntsc.bin
          test "$(stat -c %s experiments/gameplay4a_f8_ntsc.bin)" -eq 8192
          sha256sum experiments/gameplay4a_bank0.asm experiments/gameplay4a_bank1.asm experiments/gameplay4a_f8_ntsc.bin > experiments/gameplay4a_SHA256SUMS.txt
          sha256sum -c experiments/gameplay4a_SHA256SUMS.txt
      - name: Commit executable ROM source SHA and assembler trace on isolated experiment branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/gameplay4a_bank0.asm experiments/gameplay4a_bank1.asm experiments/gameplay4a_bank0.bin experiments/gameplay4a_bank1.bin experiments/gameplay4a_f8_ntsc.bin experiments/gameplay4a_SHA256SUMS.txt experiments/gameplay4a_bank0.lst experiments/gameplay4a_bank1.lst experiments/gameplay4a_bank0.sym experiments/gameplay4a_bank1.sym experiments/gameplay4a_DASM0.log experiments/gameplay4a_DASM1.log
          git commit -m 'artifact(GAMEPLAY-4): freeze true NTSC 8KiB K1T/R1 dynamic checkpoint, no faulty M1' || exit 1
          git fetch origin experiment/gameplay4-dynamic-combat-arrow-20261122
          git rebase origin/experiment/gameplay4-dynamic-combat-arrow-20261122
          git push origin HEAD:refs/heads/experiment/gameplay4-dynamic-combat-arrow-20261122
