name: P02-B2 Centered Halo and Troll (diagnostic)

on:
  push:
    branches: [experiment/p02-playfield-b2]
    paths:
      - 'experiments/p02_playfield_b2.asm'
      - '.github/workflows/p02-b2.yml'
      - 'tests/p02_b2_stella_check.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  centered-playfield:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM Stella and X11
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool scrot python3-pil
      - name: Build P02-B2 4K NTSC ROM
        shell: bash
        run: |
          mkdir -p build
          dasm experiments/p02_playfield_b2.asm -f3 -obuild/p02-playfield-b2.bin -lbuild/p02-playfield-b2.lst -sbuild/p02-playfield-b2.sym
          test "$(stat -c %s build/p02-playfield-b2.bin)" -eq 4096
          sha256sum build/p02-playfield-b2.bin | tee build/SHA256SUMS
          stella -rominfo build/p02-playfield-b2.bin | tee build/stella_rominfo.txt
      - name: Stella screenshots: levels 1 through 3
        shell: bash
        run: |
          set -euo pipefail
          export SDL_AUDIODRIVER=dummy
          export SDL_VIDEODRIVER=x11
          export SDL_RENDER_DRIVER=software
          xvfb-run -a -s "-screen 0 1024x768x24" bash -c '
            set -euo pipefail
            stella -logtoconsole 1 -audio.enabled 0 -threads 0 -vsync 0 -video software -fullscreen 0 -snapsavedir "$PWD/build" -sssingle 1 -ss1x 1 "$PWD/build/p02-playfield-b2.bin" > build/stella.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            wid=""
            for i in $(seq 1 15); do
              wid=$(xdotool search --onlyvisible --name Stella 2>/dev/null | head -1 || true)
              [ -n "$wid" ] && break
              sleep 1
            done
            test -n "$wid"
            xdotool windowfocus "$wid" || true
            sleep 1
            take(){
              xdotool key --window "$wid" F12
              sleep 0.8
              cp build/p02-playfield-b2.png "build/$1.png"
            }
            select_next(){
              xdotool keydown --window "$wid" F1
              sleep 0.3
              xdotool keyup --window "$wid" F1
              sleep 0.7
            }
            take p02_b2_level1
            select_next
            take p02_b2_level2
            select_next
            take p02_b2_level3
            scrot -z build/stella_desktop.png
          '
          /usr/bin/python3 tests/p02_b2_stella_check.py | tee build/b2_metrics.txt
      - name: Upload ROM, source listing, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: the-skraun-p02-b2-halo-troll
          path: build/
          if-no-files-found: warn
