name: PLAY1-H real 6507 NTSC DASM/Stella A-B-C X/Y candidate
on:
  push:
    branches: [experiment/play1-h-moving-visible-halo-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  play1h:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install actual DASM 6502 and Stella 6.7.1 debugger
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool scrot python3-pil python3-numpy
          mkdir -p build/play1h
      - name: Real 4096-byte NTSC assembly and SHA
        run: |
          set -euo pipefail
          dasm experiments/play1_h_single_arena.asm -f3 -obuild/play1h/play1h.bin -lbuild/play1h/play1h.lst -sbuild/play1h/play1h.sym 2>&1 | tee build/play1h/DASM.log
          test "$(stat -c %s build/play1h/play1h.bin)" -eq 4096
          sha256sum experiments/play1_h_single_arena.asm build/play1h/play1h.bin > build/play1h/SHA256SUMS
      - name: Genuine Stella gameplay joystick and FIRE A-B-C positions
        run: bash scripts/play1h_stella_abc.sh
      - name: Independent-of-script pixel oracle over real Stella screenshots (developer test)
        run: |
          set -euo pipefail
          /usr/bin/python3 tests/play1h_pixels.py | tee build/play1h/PIXELS.log
      - name: Retain raw ROM, ASM, listing/symbols, true Stella debugger images and scripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PLAY1H-original-DASM-Stella-physical-ABC
          path: |
            build/play1h/
            experiments/play1_h_single_arena.asm
            scripts/play1h_stella_abc.sh
            tests/play1h_pixels.py
          if-no-files-found: warn
