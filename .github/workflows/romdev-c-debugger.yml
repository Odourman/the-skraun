name: ROMDEV C Stella Debugger timing evidence
on:
  push:
    branches: [experiment/romdev-c-b3a]
    paths:
      - '.github/workflows/romdev-c-debugger.yml'
      - 'experiments/romdev_c_b3a.asm'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debugger:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM, Stella and display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool scrot python3-pil
      - name: Build ROM and configure genuine debugger script
        shell: bash
        run: |
          mkdir -p build "$HOME/.config/stella"
          dasm experiments/romdev_c_b3a.asm -f3 -obuild/romdev-c-b3a.bin -lbuild/romdev-c-b3a.lst -sbuild/romdev-c-b3a.sym
          sha256sum build/romdev-c-b3a.bin | tee build/ROM_SHA256.txt
          cat > "$HOME/.config/stella/autoexec.script" <<'SCRIPT'
          base dec
          frame #40
          print _scanEnd
          print _fCount
          print _fCycles
          SCRIPT
      - name: Capture Stella debugger screen, no OCR or inferred verdict
        shell: bash
        run: |
          set -euo pipefail
          export SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=x11 SDL_RENDER_DRIVER=software
          xvfb-run -a -s "-screen 0 1280x900x24" bash -c '
            stella -debug -logtoconsole 1 -audio.enabled 0 -threads 0 -vsync 0 -video software -fullscreen 0 "$PWD/build/romdev-c-b3a.bin" > build/debugger.log 2>&1 &
            pid=$!
            wid=""
            for attempt in $(seq 1 30); do
              wid=$(xdotool search --onlyvisible --name Stella 2>/dev/null | head -1 || true)
              test -n "$wid" && break
              sleep 1
            done
            test -n "$wid" || { cat build/debugger.log; exit 9; }
            sleep 3
            if [ -n "$wid" ]; then
              xdotool windowfocus "$wid" || true
              for cmd in "base dec" "frame #40" "print _scanEnd" "print _fCount" "print _fCycles"; do
                xdotool type --window "$wid" --clearmodifiers --delay 12 "$cmd" || true
                xdotool key --window "$wid" Return || true
                sleep 0.5
              done
            fi
            scrot -z build/debugger_desktop.png
            kill "$pid" 2>/dev/null || true
          '
          test -s build/debugger_desktop.png
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          im=Image.open('build/debugger_desktop.png').convert('RGB')
          nonblack=sum(max(px)>30 for px in im.getdata())
          print("Debugger screenshot visible nonblack pixels:",nonblack)
          assert nonblack>12000, "FAIL: blank Stella Debugger screenshot, no timing evidence"
          PY
      - name: Archive debugger screen and build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: romdev-c-stella-debugger-timing
          path: build/
          if-no-files-found: warn
