name: P02-R2 direct Stella Debugger NTSC dual-P1/two-line/HUD motion timing
on:
  push:
    branches: [experiment/romdev-r2-two-line-scheduler]
    paths:
      - '.github/workflows/romdev-r2-debugger.yml'
      - 'experiments/romdev_r2_*.asm'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r2-direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install original DASM Stella 6.7.1 and debugger display
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool scrot python3-pil
      - name: Exact 4K candidate ROM source, SHA, symbols/listings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          for n in twoline dual hud; do
            case "$n" in
              twoline) source=experiments/romdev_r2_two_line_p1.asm ;;
              dual) source=experiments/romdev_r2_two_line_dualcopy.asm ;;
              hud) source=experiments/romdev_r2_multikernel_hud.asm ;;
            esac
            dasm "$source" -f3 -o"build/$n.bin" -l"build/$n.lst" -s"build/$n.sym"
            test "$(stat -c%s "build/$n.bin")" -eq 4096
          done
          sha256sum build/*.bin | tee build/SHA256SUMS
      - name: Actual Stella console 262 NTSC lines, 4 joystick positions and reversal
        shell: bash
        run: |
          set -euo pipefail
          export SDL_AUDIODRIVER=dummy SDL_VIDEODRIVER=x11 SDL_RENDER_DRIVER=software
          xvfb-run -a -s "-screen 0 1280x900x24" bash -c '
            set -euo pipefail
            for n in twoline dual hud; do
              stella -debug -logtoconsole 1 -audio.enabled 0 -threads 0 -vsync 0 -video software -fullscreen 0 "$PWD/build/$n.bin" > "build/stella_debug_$n.log" 2>&1 &
              pid=$!
              win=""
              for j in $(seq 1 30); do
                win=$(xdotool search --onlyvisible --name Stella 2>/dev/null | head -1 || true)
                test -n "$win" && break
                sleep 1
              done
              test -n "$win" || exit 8
              xdotool windowfocus "$win" || true
              sleep 1.4
              cmd() {
                xdotool type --window "$win" --clearmodifiers --delay 8 "$1"
                xdotool key --window "$win" Return
                sleep 0.18
              }
              snap() { scrot -z "build/debug_$n-$1.png"; }
              cmd "base dec"
              cmd "frame #30"
              cmd "print *Mode"
              cmd "print _scanEnd"
              snap center80
              cmd "joy0Right 0"
              cmd "frame #12"
              cmd "print *Mode"
              cmd "print _scanEnd"
              snap center104
              cmd "joy0Right 1"
              cmd "joy0Left 0"
              cmd "frame #24"
              cmd "print *Mode"
              cmd "print _scanEnd"
              snap center56
              cmd "joy0Left 1"
              cmd "joy0Right 0"
              cmd "frame #12"
              cmd "print *Mode"
              cmd "print _scanEnd"
              snap reversal80
              cmd "joy0Right 1"
              cmd "saveSes $PWD/build/R2_$n-SESSION.txt"
              kill "$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
              sleep 0.5
            done
          '
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re,json
          results={}
          for name in ("twoline","dual","hud"):
              p=Path("build/R2_"+name+"-SESSION.txt")
              assert p.exists() and p.stat().st_size>300,"Missing genuine Stella debugger session "+name
              s=p.read_text()
              mode=[]
              for row in re.findall(r'> print \*Mode\n([^\n]+)',s):
                  m=re.search(r'#(\d+)',row)
                  assert m,(name,row)
                  mode.append(int(m.group(1)))
              scans=[]
              for row in re.findall(r'> print _scanEnd\n([^\n]+)',s):
                  m=re.search(r'#(\d+)',row)
                  assert m,(name,row)
                  scans.append(int(m.group(1)))
              print("GENUINE STELLA DEBUGGER",name,"Mode",mode,"NTSC scanlines",scans)
              assert mode==[6,12,0,6],(name,"wrong physical joystick trajectory",mode)
              assert scans==[262,262,262,262],(name,"unstable NTSC scanlines",scans)
              for state in ("center80","center104","center56","reversal80"):
                  im=Image.open("build/debug_"+name+"-"+state+".png").convert("RGB")
                  assert sum(max(c)>25 for c in im.getdata())>15000,(name,state,"blank debugger")
              results[name]={"mode":mode,"scanlines":scans}
          Path("build/R2_DEBUGGER_MEASUREMENTS.json").write_text(json.dumps(results,indent=2))
          print("R2 DIRECT Stella framecount PASS; per-instruction same-row budgeting remains separate STATIC analysis.")
          PY
      - name: Archive exact ROM, original debugger screenshots and text sessions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: romdev-r2-direct-debugger-12-motion-states
          path: build/
          if-no-files-found: warn
