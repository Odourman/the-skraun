name: P01 Stella Visual Smoke (diagnostic)

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/main.asm'
      - '.github/workflows/stella-smoke.yml'

permissions:
  contents: read

jobs:
  stella-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install DASM and Stella dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dasm stella xvfb xdotool scrot x11-utils python3-pil
      - name: Build ROM
        run: |
          mkdir -p build
          dasm src/main.asm -f3 -obuild/the-skraun-p01.bin -lbuild/the-skraun-p01.lst -sbuild/the-skraun-p01.sym
          sha256sum build/the-skraun-p01.bin
          stella -rominfo build/the-skraun-p01.bin
      - name: Take a Stella screenshot via Xvfb
        shell: bash
        run: |
          set -euo pipefail
          export SDL_AUDIODRIVER=dummy
          export SDL_VIDEODRIVER=x11
          export SDL_RENDER_DRIVER=software
          xvfb-run -a -s "-screen 0 1024x768x24" bash -c '
            set -eu
            stella -logtoconsole 1 -audio.enabled 0 -threads 0 -vsync 0 -video software -fullscreen 0 -snapsavedir "$PWD/build" -sssingle 1 -ss1x 1 "$PWD/build/the-skraun-p01.bin" > build/stella.log 2>&1 &
            pid=$!
            for i in $(seq 1 15); do
              if xdotool search --all --name "." > build/all_window_ids.txt 2>/dev/null; then
                break
              fi
              sleep 1
            done
            ps -p "$pid" -o pid,stat,args > build/stella_process.txt || true
            xwininfo -root -tree > build/xwininfo.txt || true
            xdotool search --all --name "." > build/all_window_ids.txt || true
            xdotool search --onlyvisible --name Stella > build/window_ids.txt || true
            wid=$(head -n1 build/window_ids.txt || true)
            if [ -n "$wid" ]; then
              xdotool windowfocus "$wid" || true
              xdotool key --window "$wid" F12
              sleep 0.5
              cp build/the-skraun-p01.png build/p01_level1.png
              xdotool key --window "$wid" F1
              sleep 0.5
              xdotool key --window "$wid" F12
              sleep 0.5
              cp build/the-skraun-p01.png build/p01_level2.png
              xdotool key --window "$wid" F1
              sleep 0.5
              xdotool key --window "$wid" F12
              sleep 0.5
              cp build/the-skraun-p01.png build/p01_level3.png
              xdotool keydown --window "$wid" Right
              sleep 0.7
              xdotool keyup --window "$wid" Right
              sleep 0.5
              xdotool key --window "$wid" F12
              sleep 0.5
              cp build/the-skraun-p01.png build/p01_level3_right.png
            fi
            scrot -z build/stella_desktop.png
            sleep 2
            kill "$pid" || true
            wait "$pid" || true
          '
          find build -maxdepth 1 -type f -printf '%f %s bytes\n'
          find build -maxdepth 1 -type f -iname '*.png' | grep .
          test -s build/window_ids.txt || { echo 'Stella window missing; visual verification NOT achieved'; exit 1; }
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          im = Image.open('build/stella_desktop.png').convert('RGB')
          pixels = im.getdata()
          unique = len(set(pixels))
          nonblack = sum(max(p)>20 for p in pixels)
          print(f'Screenshot check: {im.size}, {unique} unique colours, {nonblack} non-black pixels')
          if unique < 4 or nonblack < 200:
              raise SystemExit('Stella screenshot blank/inconclusive; fail closed.')
          PY
          /usr/bin/python3 tests/check_stella_images.py | tee build/STELLA_VISUAL_CHECK.log
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p01-stella-visual-diagnostic
          path: |
            build/*.png
            build/stella.log
            build/window_ids.txt
            build/xwininfo.txt
            build/all_window_ids.txt
            build/stella_process.txt
            build/STELLA_VISUAL_CHECK.log
            build/the-skraun-p01.bin
          if-no-files-found: warn
